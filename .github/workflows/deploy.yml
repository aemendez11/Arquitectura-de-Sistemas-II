name: Deploy to Elastic Beanstalk (Docker)

on:
  push:
    branches: [ "assignment-03" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EB_APP_NAME: ${{ vars.EB_APP_NAME }}
      EB_ENV_NAME: ${{ vars.EB_ENV_NAME }}
      EB_S3_BUCKET: ${{ vars.EB_S3_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json << 'EOF'
          {
            "AWSEBDockerrunVersion": 1,
            "Image": {
              "Name": "__IMAGE_URI__",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 80
              }
            ]
          }
          EOF
          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" Dockerrun.aws.json

      - name: Package application version
        run: |
          zip -r deploy.zip Dockerrun.aws.json

      - name: Upload bundle to S3
        env:
          S3_KEY: "deploy-${{ github.sha }}.zip"
        run: |
          aws s3 cp deploy.zip "s3://$EB_S3_BUCKET/$S3_KEY"
          echo "S3_KEY=$S3_KEY" >> $GITHUB_ENV

      - name: Create new application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="$EB_S3_BUCKET",S3Key="$S3_KEY"

      - name: Update environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "${{ github.sha }}"