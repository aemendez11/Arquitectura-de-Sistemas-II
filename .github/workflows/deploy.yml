name: deploy

on:
  push:
    branches:
      - assignment-03

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": 1,
            "Image": {
              "Name": "${IMAGE_URI}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 80
              }
            ]
          }
          EOF

      - name: Package application version
        run: |
          zip -r deploy.zip Dockerrun.aws.json

      - name: Upload bundle to S3
        env:
          EB_S3_BUCKET: ${{ secrets.EB_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp deploy.zip s3://$EB_S3_BUCKET/deploy-${GITHUB_SHA}.zip --region $AWS_REGION

      - name: Create new Elastic Beanstalk application version
        env:
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EB_S3_BUCKET: ${{ secrets.EB_S3_BUCKET }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "deploy-${GITHUB_SHA}" \
            --source-bundle S3Bucket="$EB_S3_BUCKET",S3Key="deploy-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Update Elastic Beanstalk environment
        env:
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "deploy-${GITHUB_SHA}" \
            --region "$AWS_REGION"